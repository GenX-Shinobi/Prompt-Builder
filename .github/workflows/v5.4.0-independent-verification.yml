name: v5.4.0 independent Playwright verification

on:
  push:
    branches:
      - verify/v5.4.0-independent-playwright
    paths-ignore:
      - verification-result.txt
      - Preview.jpg

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated release snapshot
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Install the documented Playwright version
        run: npm install --no-save playwright@1.63.0

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all three documented suites
        shell: bash
        run: |
          mkdir -p artifacts
          node --version > artifacts/environment.txt
          npm --version >> artifacts/environment.txt
          npx playwright --version >> artifacts/environment.txt
          node -e "console.log(require('playwright').chromium.executablePath())" >> artifacts/environment.txt

          set +e
          node tests/browser_suite_1.js > artifacts/browser_suite_1.log 2>&1
          s1=$?
          node tests/browser_suite_2.js > artifacts/browser_suite_2.log 2>&1
          s2=$?
          node tests/browser_corrective.js > artifacts/browser_corrective.log 2>&1
          s3=$?
          set -e

          printf 'suite_1_exit=%s\nsuite_2_exit=%s\ncorrective_exit=%s\n' "$s1" "$s2" "$s3" | tee artifacts/exit-codes.txt
          cat artifacts/browser_suite_1.log
          cat artifacts/browser_suite_2.log
          cat artifacts/browser_corrective.log
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ] || [ "$s3" -ne 0 ]; then
            exit 1
          fi

      - name: Capture genuine v5.4.0 interface screenshot
        if: always()
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1
            });
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'load' });
            await page.waitForTimeout(1000);
            await page.screenshot({
              path: 'artifacts/Preview.jpg',
              type: 'jpeg',
              quality: 92,
              fullPage: true
            });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Preserve evidence and refresh documentation preview after all suites pass
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f artifacts/exit-codes.txt ]; then
            cp artifacts/exit-codes.txt verification-result.txt
          else
            printf 'Suite exit codes unavailable; inspect workflow logs.\n' > verification-result.txt
          fi
          {
            echo
            echo "Release source commit: ad459df8c014fc01dce893ff5374e4e4d8e2280a"
            echo "Verification branch commit: ${GITHUB_SHA}"
            cat artifacts/environment.txt 2>/dev/null || true
            echo
            for f in artifacts/browser_suite_1.log artifacts/browser_suite_2.log artifacts/browser_corrective.log; do
              echo "### $f"
              grep -E '[0-9]+ passed, [0-9]+ failed|Error:|FAIL ' "$f" 2>/dev/null | tail -20 || true
            done
          } >> verification-result.txt

          if [ -f artifacts/Preview.jpg ]; then
            cp artifacts/Preview.jpg Preview.jpg
            git add Preview.jpg
          fi
          git add verification-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record independent v5.4.0 verification evidence" || true
          git push origin HEAD:refs/heads/verify/v5.4.0-independent-playwright

          if grep -q 'suite_1_exit=0' artifacts/exit-codes.txt 2>/dev/null &&
             grep -q 'suite_2_exit=0' artifacts/exit-codes.txt 2>/dev/null &&
             grep -q 'corrective_exit=0' artifacts/exit-codes.txt 2>/dev/null &&
             [ -f artifacts/Preview.jpg ]; then
            git clone --quiet --branch docs/chimera-session-maintenance \
              "https://x-access-token:${GH_TOKEN}@github.com/GenX-Shinobi/Prompt-Builder.git" \
              "$RUNNER_TEMP/docs-preview"
            cp artifacts/Preview.jpg "$RUNNER_TEMP/docs-preview/Preview.jpg"
            cd "$RUNNER_TEMP/docs-preview"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Preview.jpg
            git commit -m "docs: refresh v5.4.0 README preview"
            git push origin HEAD:refs/heads/docs/chimera-session-maintenance
          fi

      - name: Upload test logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5.4.0-independent-verification
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
